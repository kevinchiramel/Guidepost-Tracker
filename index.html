<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Guidepost Tracker 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=DM+Mono:wght@300;400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ── Variables ───────────────────────────────────────────────────── */
:root {
  --cream: #f5f0e8;
  --paper: #faf7f2;
  --ink: #1a1714;
  --ink-light: #5a5550;
  --ink-faint: #a09890;
  --rule: #e0d8cc;
  --accent: #c4622d;
  --a: #4a7c6f;
  --b: #7a5c8a;
  --c: #2e5fa3;
  --d: #b5853a;
  --e: #c4622d;
  --f: #4a5568;
  --g: #7a6652;
  --h: #8a8a7a;
  --i: #7a8a7a;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-top: env(safe-area-inset-top, 0px);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overscroll-behavior: none; }

body {
  font-family: 'DM Sans', sans-serif;
  background: var(--cream);
  color: var(--ink);
  font-size: 14px;
  -webkit-tap-highlight-color: transparent;
}

/* ════════════════════════════════════════════
   MOBILE  (< 640px)  — minimal log screen
   ════════════════════════════════════════════ */

/* ── Header ── */
header {
  background: var(--ink);
  color: var(--cream);
  padding: 14px 16px 12px;
  padding-top: calc(14px + var(--safe-top));
  display: flex;
  align-items: center;
  gap: 10px;
  position: sticky;
  top: 0;
  z-index: 100;
}
header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.3px;
}
header .year {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--ink-faint);
  letter-spacing: 1px;
}
header .spacer { flex: 1; }

/* hide desktop controls on mobile */
.view-toggle { display: none; }
.data-btns { display: none; }
.period-bar-desktop { display: none; }
.period-bar { display: none; }

/* mobile import/export */
.mobile-data-btns {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}
.mobile-data-btn {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.3px;
  background: rgba(255,255,255,0.10);
  border: 1px solid rgba(255,255,255,0.18);
  color: rgba(245,240,232,0.8);
  padding: 6px 10px;
  border-radius: 5px;
  cursor: pointer;
  min-height: 32px;
  white-space: nowrap;
}

/* ── Mobile date bar ── */
.mobile-datebar {
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  display: flex;
  align-items: center;
  position: sticky;
  top: calc(46px + var(--safe-top));
  z-index: 90;
  min-height: 52px;
  padding: 0 4px;
}
.mobile-datebar .p-arrow {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  padding: 0 14px;
  color: var(--ink-light);
  min-height: 52px;
  display: flex;
  align-items: center;
}
.mobile-date-center {
  flex: 1;
  text-align: center;
  cursor: pointer;
  padding: 6px 0;
  user-select: none;
}
.mobile-date-dow {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  letter-spacing: 1px;
  color: var(--ink-faint);
  text-transform: uppercase;
}
.mobile-date-main {
  font-family: 'Playfair Display', serif;
  font-size: 18px;
  color: var(--ink);
  line-height: 1.1;
  margin-top: 1px;
}
.mobile-date-main.is-today { color: var(--accent); }

/* ── Mobile guidepost list ── */
main { padding: 0 0 calc(40px + var(--safe-bottom)); }

.mobile-list { display: flex; flex-direction: column; }

.ml-row {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 15px 18px;
  border-bottom: 1px solid var(--rule);
  cursor: pointer;
  background: var(--paper);
  transition: background 0.1s;
  -webkit-tap-highlight-color: transparent;
  position: relative;
  min-height: 64px;
}
.ml-row:active { background: var(--cream); }
.ml-row.secondary { opacity: 0.55; background: transparent; }
.ml-row.secondary:active { opacity: 0.75; }

.ml-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
  margin-top: 2px;
}
.ml-body { flex: 1; min-width: 0; }
.ml-label {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  font-style: italic;
  color: var(--ink);
  line-height: 1.2;
}
.ml-row.secondary .ml-label { font-size: 13px; }

.ml-entries {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-top: 5px;
}
.ml-pill {
  font-size: 11px;
  padding: 2px 7px;
  border-radius: 3px;
  line-height: 1.4;
  max-width: 100%;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.ml-empty {
  font-family: 'DM Mono', monospace;
  font-size: 10px;
  color: var(--rule);
  margin-top: 4px;
}
.ml-arrow {
  font-size: 16px;
  color: var(--rule);
  flex-shrink: 0;
}

/* checkbox row in list */
.ml-row.cb-row { cursor: default; }
.ml-cb {
  width: 26px; height: 26px;
  border-radius: 6px;
  border: 1.5px solid var(--rule);
  background: var(--cream);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; color: transparent;
  flex-shrink: 0;
  transition: background 0.15s, border-color 0.15s;
  cursor: pointer;
}
.ml-cb.checked { background: var(--h); border-color: var(--h); color: #fff; }

/* budget row in list */
.ml-row.budget-row { cursor: default; }
.ml-budget-input {
  font-family: 'DM Mono', monospace;
  font-size: 18px;
  width: 110px;
  padding: 6px 10px;
  border: 1.5px solid var(--rule);
  border-radius: 8px;
  background: var(--cream);
  color: var(--ink);
  outline: none;
  text-align: right;
  -webkit-appearance: none;
  appearance: none;
  flex-shrink: 0;
}
.ml-budget-input:focus { border-color: var(--accent); }
.ml-budget-input.surplus { color: #3a7a4a; border-color: rgba(58,122,74,.4); background: rgba(58,122,74,.06); }
.ml-budget-input.deficit { color: #c04040; border-color: rgba(192,64,64,.4); background: rgba(192,64,64,.06); }
.ml-budget-symbol {
  font-family: 'DM Mono', monospace;
  font-size: 12px;
  color: var(--ink-faint);
  flex-shrink: 0;
}

/* ── Bottom sheet modal ── */
.modal-backdrop {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(26,23,20,.5);
  z-index: 200;
  align-items: flex-end;
  justify-content: center;
}
.modal-backdrop.open { display: flex; }
.modal {
  background: var(--paper);
  border-radius: 18px 18px 0 0;
  width: 100%;
  max-width: 560px;
  padding-bottom: calc(20px + var(--safe-bottom));
  box-shadow: 0 -8px 40px rgba(0,0,0,.18);
  animation: slideUp 0.22s cubic-bezier(.4,0,.2,1);
  max-height: 88vh;
  overflow-y: auto;
}
@keyframes slideUp {
  from { transform: translateY(100%); }
  to   { transform: translateY(0); }
}
.modal-handle {
  width: 36px; height: 4px;
  background: var(--rule);
  border-radius: 2px;
  margin: 12px auto 0;
}
.modal-inner { padding: 16px 20px 0; }
.modal-date {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: var(--ink-faint);
  letter-spacing: 0.5px;
  margin-bottom: 4px;
}
.modal-title {
  font-family: 'Playfair Display', serif;
  font-size: 19px;
  font-weight: 600;
  margin-bottom: 14px;
  line-height: 1.2;
}
.code-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.code-chip {
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  padding: 6px 11px;
  border-radius: 5px;
  border: 1.5px solid var(--rule);
  background: none;
  cursor: pointer;
  color: var(--ink-light);
  transition: all 0.12s;
  min-height: 38px;
}
.modal textarea {
  width: 100%;
  border: 1.5px solid var(--rule);
  border-radius: 8px;
  background: var(--cream);
  font-family: 'DM Sans', sans-serif;
  font-size: 16px;
  color: var(--ink);
  padding: 12px 14px;
  resize: none;
  height: 88px;
  outline: none;
  transition: border-color 0.15s;
  -webkit-appearance: none;
}
.modal textarea:focus { border-color: var(--accent); }
.modal-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 12px;
}
.btn-delete {
  background: none; border: none;
  font-size: 13px; color: var(--ink-faint);
  cursor: pointer; padding: 8px 0;
  text-decoration: underline; text-underline-offset: 2px;
  min-height: 44px;
}
.btn-delete:active { color: #c00; }
.btn-delete.hidden { visibility: hidden; }
.modal-actions .right { display: flex; gap: 8px; }
.btn-cancel, .btn-save {
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; font-weight: 500;
  padding: 11px 22px;
  border-radius: 8px; cursor: pointer; border: none;
  transition: all 0.15s; min-height: 44px;
}
.btn-cancel { background: var(--cream); color: var(--ink-light); border: 1.5px solid var(--rule); }
.btn-save { background: var(--ink); color: var(--cream); }
.btn-save:active { background: var(--accent); }

/* Category colours */
.cat-a{color:var(--a)}.cat-b{color:var(--b)}.cat-c{color:var(--c)}
.cat-d{color:var(--d)}.cat-e{color:var(--e)}.cat-f{color:var(--f)}.cat-g{color:var(--g)}.cat-h{color:var(--h)}.cat-i{color:var(--i)}
.pill-a{background:rgba(74,124,111,.13);color:var(--a)}
.pill-b{background:rgba(122,92,138,.13);color:var(--b)}
.pill-c{background:rgba(46,95,163,.13);color:var(--c)}
.pill-d{background:rgba(181,133,58,.13);color:var(--d)}
.pill-e{background:rgba(196,98,45,.13);color:var(--e)}
.pill-f{background:rgba(74,85,104,.13);color:var(--f)}
.pill-g{background:rgba(122,102,82,.13);color:var(--g)}
.pill-h{background:rgba(138,138,122,.13);color:var(--h)}
.pill-i{background:rgba(122,138,122,.13);color:var(--i)}
.chip-a.selected{background:var(--a)!important;color:#fff!important;border-color:var(--a)!important}
.chip-b.selected{background:var(--b)!important;color:#fff!important;border-color:var(--b)!important}
.chip-c.selected{background:var(--c)!important;color:#fff!important;border-color:var(--c)!important}
.chip-d.selected{background:var(--d)!important;color:#fff!important;border-color:var(--d)!important}
.chip-e.selected{background:var(--e)!important;color:#fff!important;border-color:var(--e)!important}
.chip-f.selected{background:var(--f)!important;color:#fff!important;border-color:var(--f)!important}
.chip-g.selected{background:var(--g)!important;color:#fff!important;border-color:var(--g)!important}
.chip-h.selected{background:var(--h)!important;color:#fff!important;border-color:var(--h)!important}
.chip-i.selected{background:var(--i)!important;color:#fff!important;border-color:var(--i)!important}
.dot-a{background:var(--a)}.dot-b{background:var(--b)}.dot-c{background:var(--c)}
.dot-d{background:var(--d)}.dot-e{background:var(--e)}.dot-f{background:var(--f)}.dot-g{background:var(--g)}.dot-h{background:var(--h)}.dot-i{background:var(--i)}

/* ════════════════════════════════════════════
   DESKTOP  (≥ 640px)
   ════════════════════════════════════════════ */
@media (min-width: 640px) {
  header { padding: 20px 32px 18px; }
  header h1 { font-size: 22px; }
  header .year { font-size: 11px; }

  /* show desktop controls */
  .view-toggle { display: flex; gap: 2px; background: rgba(255,255,255,0.08); border-radius: 6px; padding: 3px; }
  .mobile-data-btns { display: none; }
  .view-toggle button {
    font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.5px;
    background: none; border: none; color: var(--ink-faint);
    padding: 6px 10px; border-radius: 4px; cursor: pointer; transition: all 0.15s; min-height: 32px;
  }
  .view-toggle button.active { background: var(--cream); color: var(--ink); }

  .data-btns { display: flex; gap: 6px; flex-shrink: 0; }
  .data-btn {
    font-family: 'DM Mono', monospace; font-size: 10px; letter-spacing: 0.4px;
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: rgba(245,240,232,0.75); padding: 6px 11px; border-radius: 5px;
    cursor: pointer; transition: all 0.15s; min-height: 32px; white-space: nowrap;
  }
  .data-btn:hover { background: rgba(255,255,255,0.16); color: var(--cream); }

  .mobile-datebar { display: none; }
  .period-bar-desktop {
    display: flex;
    background: var(--paper); border-bottom: 1px solid var(--rule);
    align-items: center; padding: 0 24px;
    position: sticky; top: 60px; z-index: 90;
  }
  .period-bar-desktop .p-arrow {
    background: none; border: none; font-size: 16px; cursor: pointer;
    padding: 12px 10px; color: var(--ink-light); flex-shrink: 0;
  }
  .period-bar-desktop .periods {
    display: flex; flex: 1; overflow-x: auto; scrollbar-width: none;
  }
  .period-bar-desktop .periods::-webkit-scrollbar { display: none; }
  .period-btn {
    font-family: 'DM Mono', monospace; font-size: 11px;
    background: none; border: none; border-bottom: 2px solid transparent;
    color: var(--ink-faint); padding: 12px 16px 10px; cursor: pointer;
    white-space: nowrap; transition: all 0.15s; flex-shrink: 0;
  }
  .period-btn.active { color: var(--ink); border-bottom-color: var(--accent); }

  main { padding: 28px 32px 60px; max-width: 1400px; }

  /* hide mobile list, show desktop views */
  .mobile-list { display: none; }
  .mobile-datebar { display: none; }
  .desktop-week { display: block !important; }
  .mobile-week { display: none !important; }

  /* modal becomes a centred popup */
  .modal-backdrop { align-items: center; }
  .modal {
    border-radius: 10px; max-width: 440px; padding-bottom: 0;
    max-height: 85vh; animation: popIn 0.18s ease;
  }
  .modal-handle { display: none; }
  .modal-inner { padding: 20px 24px 24px; }
  @keyframes popIn {
    from { transform: scale(0.95); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }

  /* desktop week grid */
  .week-grid {
    display: grid;
    grid-template-columns: 180px repeat(7, 1fr);
    border-top: 1px solid var(--rule);
    border-left: 1px solid var(--rule);
  }
  .week-grid .cell {
    border-right: 1px solid var(--rule);
    border-bottom: 1px solid var(--rule);
    padding: 12px 14px; min-height: 56px;
  }
  .day-label-main { font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: 0.5px; display: block; }
  .day-label-sub { font-size: 10px; color: var(--ink-faint); display: block; margin-top: 1px; }
  .guidepost-label { font-family: 'Playfair Display', serif; font-size: 13px; font-style: italic; line-height: 1.3; }
  .codes { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--ink-faint); margin-top: 4px; line-height: 1.5; display: block; }
  .entry-cell { position: relative; cursor: pointer; transition: background 0.1s; }
  .entry-cell:hover { background: rgba(196,98,45,0.04); }
  .entry-cell.today { background: #fff8f4; }
  .entry-pill-sm {
    display: inline-block; font-size: 11px; line-height: 1.4;
    padding: 3px 8px 3px 6px; border-radius: 3px; margin: 2px 0;
    max-width: 100%; word-break: break-word; cursor: pointer;
  }
  .entry-pill-sm:hover { opacity: 0.75; }
  .add-btn-hover {
    display: none; font-size: 18px; color: var(--ink-faint);
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%,-50%); pointer-events: none;
  }
  .entry-cell:hover .add-btn-hover { display: block; }
  .secondary-row { opacity: 0.6; background: rgba(250,247,242,0.5) !important; }
  .cb-cell { display: flex; align-items: center; justify-content: center; }
  .cb-cell-toggle {
    width: 20px; height: 20px; border-radius: 4px; border: 1.5px solid var(--rule);
    background: var(--cream); cursor: pointer; display: flex; align-items: center;
    justify-content: center; font-size: 12px; color: transparent;
    transition: background 0.15s, border-color 0.15s;
  }
  .cb-cell-toggle.checked { background: var(--h); border-color: var(--h); color: #fff; }
  .budget-cell { display: flex; align-items: center; justify-content: center; padding: 8px 6px; }
  .budget-cell-input {
    font-family: 'DM Mono', monospace; font-size: 12px; width: 100%; max-width: 90px;
    padding: 5px 7px; border: 1.5px solid var(--rule); border-radius: 5px;
    background: var(--cream); color: var(--ink); outline: none;
    transition: border-color 0.15s, color 0.15s; text-align: right;
  }
  .budget-cell-input:focus { border-color: var(--accent); }
  .budget-cell-input.surplus { color: #3a7a4a; border-color: rgba(58,122,74,.3); background: rgba(58,122,74,.05); }
  .budget-cell-input.deficit { color: #c04040; border-color: rgba(192,64,64,.3); background: rgba(192,64,64,.05); }

  /* desktop month view */
  .month-guidepost { margin-bottom: 26px; }
  .month-guidepost.secondary { opacity: 0.6; }
  .month-guidepost-header { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--rule); }
  .month-guidepost-title { font-family: 'Playfair Display', serif; font-size: 18px; font-weight: 600; }
  .month-guidepost-codes { font-family: 'DM Mono', monospace; font-size: 9px; color: var(--ink-faint); }
  .month-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 5px; }
  .month-day-cell { background: var(--paper); border-radius: 5px; padding: 8px 10px; min-height: 68px; cursor: pointer; border: 1px solid var(--rule); transition: border-color 0.15s; }
  .month-day-cell:hover { border-color: var(--accent); }
  .month-day-cell.today { border-color: var(--accent); background: #fff8f4; }
  .month-day-cell.other-month { opacity: 0.28; }
  .month-day-num { font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-faint); margin-bottom: 2px; }
  .month-day-cell.today .month-day-num { color: var(--accent); font-weight: bold; }
  .month-entry { font-size: 10px; line-height: 1.3; padding: 1px 4px; border-radius: 2px; margin-bottom: 1px; word-break: break-word; cursor: pointer; }
  .corner-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .month-cb-dot { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--rule); background: transparent; cursor: pointer; margin: 2px auto 0; transition: background 0.15s, border-color 0.15s; display: block; }
  .month-cb-dot.checked { background: var(--h); border-color: var(--h); }
  .month-budget-input {
    font-family: 'DM Mono', monospace; font-size: 9px; width: 100%; padding: 2px 3px;
    border: 1px solid var(--rule); border-radius: 3px; background: transparent;
    color: var(--ink-faint); outline: none; text-align: right; margin-top: 2px;
    -webkit-appearance: none; appearance: none;
  }
  .month-budget-input:focus { border-color: var(--accent); color: var(--ink); }
  .month-budget-input.surplus { color: #3a7a4a; border-color: rgba(58,122,74,.3); }
  .month-budget-input.deficit { color: #c04040; border-color: rgba(192,64,64,.3); }
  .month-budget-input::placeholder { color: var(--rule); }
}

.desktop-week { display: block; }
.mobile-week  { display: none; }

</style>
</head>
<body>

<header>
  <h1>Guidepost Tracker</h1>
  <span class="year">2026</span>
  <div class="spacer"></div>
  <!-- Mobile import/export -->
  <div class="mobile-data-btns">
    <button class="mobile-data-btn" onclick="exportData()">↓ Export</button>
    <button class="mobile-data-btn" onclick="triggerImport()">↑ Import</button>
  </div>
  <!-- Desktop import/export + view toggle -->
  <div class="data-btns">
    <button class="data-btn" onclick="exportData()" title="Export all entries as JSON">↓ Export</button>
    <button class="data-btn" onclick="triggerImport()" title="Import entries from JSON">↑ Import</button>
  </div>
  <input type="file" id="import-file-input" accept=".json" style="display:none" onchange="importData(event)">
  <div class="view-toggle">
    <button id="btn-week" class="active" onclick="setView('week')">WEEK</button>
    <button id="btn-month" onclick="setView('month')">MONTH</button>
  </div>
</header>

<!-- Mobile date bar -->
<div class="mobile-datebar" id="mobile-datebar">
  <button class="p-arrow" onclick="shiftMobileDay(-1)">&#8592;</button>
  <div class="mobile-date-center" onclick="goToToday()">
    <div class="mobile-date-dow" id="mobile-dow"></div>
    <div class="mobile-date-main" id="mobile-date-main"></div>
  </div>
  <button class="p-arrow" onclick="shiftMobileDay(1)">&#8594;</button>
</div>

<!-- Desktop period bar -->
<div class="period-bar-desktop" id="desktop-period-bar">
  <button class="p-arrow" onclick="shiftPeriod(-1)">&#8592;</button>
  <div class="periods" id="period-list"></div>
  <button class="p-arrow" onclick="shiftPeriod(1)">&#8594;</button>

<!-- Entry modal -->
<div class="modal-backdrop" id="modal-backdrop" onclick="handleBackdropClick(event)">

        <button class="btn-delete hidden" id="btn-delete" onclick="deleteEntry()">Delete</button>
        <div class="right">
          <button class="btn-cancel" onclick="closeModal()">Cancel</button>
          <button class="btn-save" onclick="saveEntry()">Save</button>

<div class="modal-backdrop" id="picker-backdrop" onclick="closePeriodPicker()" style="z-index:300">
  <div class="modal" style="max-height:65vh;overflow-y:auto;padding-bottom:calc(16px + var(--safe-bottom));">
    <div class="modal-handle"></div>
    <div id="picker-list" style="padding:6px 0 2px;"></div>
  </div>
</div>

<script>
// ── Data ──────────────────────────────────────────────────────────────

const GUIDEPOSTS = [
  { id:'A', label:'Adventurous', catClass:'cat-a', pillClass:'pill-a', chipClass:'chip-a', dotBg:'var(--a)', dotClass:'dot-a',
    codes:[{code:'A1',desc:'Physical risk'},{code:'A2',desc:'Emotional risk'},{code:'A3',desc:'Social risk'},{code:'A4',desc:'"Adventure is other people"'}] },
  { id:'B', label:'Mental & physical health', catClass:'cat-b', pillClass:'pill-b', chipClass:'chip-b', dotBg:'var(--b)', dotClass:'dot-b',
    codes:[{code:'B1',desc:'Exercise routine'},{code:'B2',desc:'Balanced, moderate diet'},{code:'B3',desc:'Meditation'}] },
  { id:'C', label:'Intellectually stimulating', catClass:'cat-c', pillClass:'pill-c', chipClass:'chip-c', dotBg:'var(--c)', dotClass:'dot-c',
    codes:[{code:'C1',desc:'Daily reading'},{code:'C2',desc:'Learn new skills & tools'}] },
  { id:'D', label:'Financially stable', catClass:'cat-d', pillClass:'pill-d', chipClass:'chip-d', dotBg:'var(--d)', dotClass:'dot-d',
    codes:[{code:'D1',desc:'Investment plan'},{code:'D2',desc:'Follow a budget'},{code:'D3',desc:"Don't overspend"}] },
  { id:'E', label:'Long-lasting personal relationships', catClass:'cat-e', pillClass:'pill-e', chipClass:'chip-e', dotBg:'var(--e)', dotClass:'dot-e',
    codes:[{code:'E1',desc:''}] },
  { id:'F', label:'Professional life', catClass:'cat-f', pillClass:'pill-f', chipClass:'chip-f', dotBg:'var(--f)', dotClass:'dot-f',
    codes:[{code:'F1',desc:''}] },
  { id:'G', label:'Chores & Errands', catClass:'cat-g', pillClass:'pill-g', chipClass:'chip-g', dotBg:'var(--g)', dotClass:'dot-g',
    codes:[{code:'G1',desc:''}], secondary:true },
  { id:'H', label:'Coffeeshop', catClass:'cat-h', pillClass:'pill-h', chipClass:'chip-h', dotBg:'var(--h)', dotClass:'dot-h',
    codes:[], checkbox:true, secondary:true },
  { id:'I', label:'Budget — total deficit', catClass:'cat-i', pillClass:'pill-i', chipClass:'chip-i', dotBg:'var(--i)', dotClass:'dot-i',
    codes:[], budget:true, secondary:true },
];

const STORAGE_KEY = 'guidepost_tracker_2026';

// ── GitHub sync config ────────────────────────────────────────────────
// Open this file in a text editor and replace the placeholder below
// with your GitHub personal access token (repo scope).
const GH_TOKEN  = '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';
const GH_OWNER  = 'kevinchiramel';
const GH_REPO   = 'Guidepost-Tracker';
const GH_FILE   = 'data.json';
const GH_API    = `https://api.github.com/repos/${GH_OWNER}/${GH_REPO}/contents/${GH_FILE}`;

let entries = {};
let ghFileSha = null;   // needed for updates
let syncPending = false;
let syncTimer = null;

// ── Local fallback ────────────────────────────────────────────────────
function loadLocal(){ try{ return JSON.parse(localStorage.getItem(STORAGE_KEY))||{}; }catch{ return {}; } }
function saveLocal(d){ localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); }

// ── GitHub read ───────────────────────────────────────────────────────
async function loadFromGitHub(){
  showSyncStatus('syncing');
  try {
    const res = await fetch(GH_API, {
      headers: { Authorization: `token ${GH_TOKEN}`, Accept: 'application/vnd.github.v3+json' }
    });
    if(res.status === 404){
      // File doesn't exist yet — start fresh or use local data
      entries = loadLocal();
      showSyncStatus('ok');
      return;
    }
    if(!res.ok) throw new Error(`GitHub ${res.status}`);
    const json = await res.json();
    ghFileSha = json.sha;
    const decoded = JSON.parse(atob(json.content.replace(/\n/g,'')));
    // Merge: GitHub wins (it's the source of truth)
    entries = decoded;
    saveLocal(entries);
    showSyncStatus('ok');
  } catch(e) {
    console.warn('GitHub load failed, using local:', e);
    entries = loadLocal();
    showSyncStatus('offline');
  }
}

// ── GitHub write ──────────────────────────────────────────────────────
async function saveToGitHub(){
  syncPending = false;
  showSyncStatus('syncing');
  try {
    const content = btoa(unescape(encodeURIComponent(JSON.stringify(entries, null, 2))));
    const body = {
      message: `sync: ${new Date().toISOString().slice(0,16)}`,
      content,
      ...(ghFileSha ? { sha: ghFileSha } : {})
    };
    const res = await fetch(GH_API, {
      method: 'PUT',
      headers: {
        Authorization: `token ${GH_TOKEN}`,
        Accept: 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    });
    if(!res.ok) throw new Error(`GitHub ${res.status}`);
    const json = await res.json();
    ghFileSha = json.content.sha;
    showSyncStatus('ok');
  } catch(e) {
    console.warn('GitHub save failed:', e);
    showSyncStatus('offline');
  }
}

// Debounce writes — wait 1.5s after last change before committing
function saveData(d){
  entries = d;
  saveLocal(d);
  syncPending = true;
  clearTimeout(syncTimer);
  syncTimer = setTimeout(saveToGitHub, 1500);
}

// ── Sync status indicator ─────────────────────────────────────────────
function showSyncStatus(state){
  let el = document.getElementById('sync-dot');
  if(!el){
    el = document.createElement('div');
    el.id = 'sync-dot';
    Object.assign(el.style, {
      position:'fixed', bottom:'16px', right:'16px',
      width:'8px', height:'8px', borderRadius:'50%',
      zIndex:'500', transition:'background 0.4s',
      boxShadow:'0 1px 4px rgba(0,0,0,.2)'
    });
    document.body.appendChild(el);
  }
  el.style.background = state==='ok' ? '#4a7c6f' : state==='syncing' ? '#b5853a' : '#c04040';
  el.title = state==='ok' ? 'Synced' : state==='syncing' ? 'Saving…' : 'Offline — saved locally';
}

// checkbox: entries[dateStr]['H'] = true/false
function getCheckbox(dateStr, gpId){ return !!(entries[dateStr]&&entries[dateStr][gpId]===true); }
function toggleCheckbox(dateStr, gpId){
  if(!entries[dateStr]) entries[dateStr]={};
  entries[dateStr][gpId] = !getCheckbox(dateStr,gpId);
  if(!entries[dateStr][gpId]) delete entries[dateStr][gpId];
  if(!Object.keys(entries[dateStr]).length) delete entries[dateStr];
  saveData(entries);
  renderContent();
}

// budget: entries[dateStr]['I'] = number (negative=deficit, positive=surplus, null=unset)
function getBudget(dateStr){ return (entries[dateStr]&&entries[dateStr]['I']!==undefined)?entries[dateStr]['I']:null; }
function setBudget(dateStr, val){
  const num = val===''||val===null ? null : parseFloat(val);
  if(!entries[dateStr]) entries[dateStr]={};
  if(num===null||isNaN(num)){ delete entries[dateStr]['I']; }
  else { entries[dateStr]['I']=num; }
  if(!Object.keys(entries[dateStr]).length) delete entries[dateStr];
  saveData(entries);
}
function budgetClass(val){ if(val===null) return ''; return val>=0?'surplus':'deficit'; }
function budgetDisplay(val){ if(val===null) return ''; return (val>=0?'+':'')+val; }

// ── Date helpers ──────────────────────────────────────────────────────

const DAY_NAMES   = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

function toDateStr(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function todayStr(){ return toDateStr(new Date()); }
function addDays(d,n){ const r=new Date(d); r.setDate(r.getDate()+n); return r; }
function startOfWeek(d){
  const day=d.getDay(), diff=day===0?-6:1-day;
  const m=new Date(d); m.setDate(m.getDate()+diff); m.setHours(0,0,0,0); return m;
}
function weekNumber(date){
  const d=new Date(Date.UTC(date.getFullYear(),date.getMonth(),date.getDate()));
  const dn=d.getUTCDay()||7; d.setUTCDate(d.getUTCDate()+4-dn);
  const ys=new Date(Date.UTC(d.getUTCFullYear(),0,1));
  return Math.ceil((((d-ys)/86400000)+1)/7);
}
function weekLabel(start){
  const end=addDays(start,6), wn=weekNumber(start);
  if(start.getMonth()===end.getMonth())
    return `W${wn} · ${MONTH_NAMES[start.getMonth()].slice(0,3)} ${start.getDate()}–${end.getDate()}`;
  return `W${wn} · ${MONTH_NAMES[start.getMonth()].slice(0,3)} ${start.getDate()} – ${MONTH_NAMES[end.getMonth()].slice(0,3)} ${end.getDate()}`;
}

function allWeeks(){
  const weeks=[]; let d=startOfWeek(new Date(2026,0,1));
  for(let i=0;i<56;i++){ weeks.push(new Date(d)); d=addDays(d,7); if(d.getFullYear()>2026&&d.getMonth()>0) break; }
  return weeks;
}
const ALL_WEEKS = allWeeks();

// ── State ─────────────────────────────────────────────────────────────

let currentView='week';
let currentWeekIdx=Math.max(0, ALL_WEEKS.findIndex(w=>toDateStr(w)===toDateStr(startOfWeek(new Date()))));
let currentMonthIdx=new Date().getMonth();

// ── Period nav ────────────────────────────────────────────────────────

function renderPeriodNav(){
  // Mobile period text (only present on mobile, skip if absent)
  const mpt=document.getElementById('mobile-period-text');
  if(mpt) mpt.textContent = currentView==='week' ? weekLabel(ALL_WEEKS[currentWeekIdx]) : MONTH_NAMES[currentMonthIdx];

  // Desktop
  const list=document.getElementById('period-list');
  list.innerHTML='';
  if(currentView==='week'){
    ALL_WEEKS.forEach((w,i)=>{
      const btn=document.createElement('button');
      btn.className='period-btn'+(i===currentWeekIdx?' active':'');
      btn.textContent=weekLabel(w);
      btn.onclick=()=>{ currentWeekIdx=i; renderAll(); };
      list.appendChild(btn);
    });
    setTimeout(()=>{ const a=list.querySelector('.active'); if(a) a.scrollIntoView({inline:'center',behavior:'smooth'}); },50);
  } else {
    Array.from({length:12},(_,m)=>m).forEach(m=>{
      const btn=document.createElement('button');
      btn.className='period-btn'+(m===currentMonthIdx?' active':'');
      btn.textContent=MONTH_NAMES[m];
      btn.onclick=()=>{ currentMonthIdx=m; renderAll(); };
      list.appendChild(btn);
    });
  }
}

function shiftPeriod(dir){
  if(currentView==='week') currentWeekIdx=Math.max(0,Math.min(ALL_WEEKS.length-1,currentWeekIdx+dir));
  else currentMonthIdx=Math.max(0,Math.min(11,currentMonthIdx+dir));
  renderAll();
}

function setView(v){
  currentView=v;
  document.getElementById('btn-week').classList.toggle('active',v==='week');
  document.getElementById('btn-month').classList.toggle('active',v==='month');
  renderAll();
}

// ── Period picker (mobile) ────────────────────────────────────────────

function showPeriodPicker(){
  const list=document.getElementById('picker-list');
  list.innerHTML='';
  const items=currentView==='week'
    ? ALL_WEEKS.map((w,i)=>({label:weekLabel(w),idx:i,active:i===currentWeekIdx}))
    : Array.from({length:12},(_,m)=>({label:MONTH_NAMES[m],idx:m,active:m===currentMonthIdx}));

  items.forEach(item=>{
    const btn=document.createElement('button');
    Object.assign(btn.style,{
      display:'block',width:'100%',background:'none',border:'none',
      textAlign:'left',padding:'13px 24px',
      fontFamily:"'DM Mono',monospace",fontSize:'12px',
      color:item.active?'var(--accent)':'var(--ink-light)',
      cursor:'pointer',borderBottom:'1px solid var(--rule)',
    });
    btn.textContent=(item.active?'→  ':'')+item.label;
    btn.onclick=()=>{
      if(currentView==='week') currentWeekIdx=item.idx;
      else currentMonthIdx=item.idx;
      closePeriodPicker(); renderAll();
    };
    list.appendChild(btn);
  });

  document.getElementById('picker-backdrop').classList.add('open');
  setTimeout(()=>{
    const active=list.querySelector('button[style*="accent"]');
    if(active) active.scrollIntoView({block:'center'});
  },120);
}

function closePeriodPicker(){
  document.getElementById('picker-backdrop').classList.remove('open');
}

// ── Mobile state ──────────────────────────────────────────────────────

let mobileDateStr = todayStr();

function shiftMobileDay(dir){
  const d=new Date(mobileDateStr);
  d.setDate(d.getDate()+dir);
  // stay within 2026
  const y=d.getFullYear();
  if(y<2026||y>2026) return;
  mobileDateStr=toDateStr(d);
  renderMobileDateBar();
  renderContent();
}

function goToToday(){
  mobileDateStr=todayStr();
  renderMobileDateBar();
  renderContent();
}

function renderMobileDateBar(){
  const d=new Date(mobileDateStr);
  const dow=DAY_NAMES[(d.getDay()||7)-1];
  const dayNum=d.getDate();
  const mon=MONTH_NAMES[d.getMonth()];
  document.getElementById('mobile-dow').textContent=dow.toUpperCase();
  const el=document.getElementById('mobile-date-main');
  el.textContent=`${dayNum} ${mon}`;
  el.className='mobile-date-main'+(mobileDateStr===todayStr()?' is-today':'');
}

// ── Mobile list view ──────────────────────────────────────────────────

function renderMobileList(){
  const ds=mobileDateStr;
  let html='<div class="mobile-list">';
  GUIDEPOSTS.forEach(gp=>{
    const secClass=gp.secondary?' secondary':'';
    if(gp.checkbox){
      const checked=getCheckbox(ds,gp.id);
      html+=`<div class="ml-row cb-row${secClass}">
        <div class="ml-dot" style="background:${gp.dotBg}"></div>
        <div class="ml-body"><div class="ml-label ${gp.catClass}">${gp.label}</div></div>
        <div class="ml-cb${checked?' checked':''}" onclick="toggleCheckbox('${ds}','${gp.id}');renderContent()">${checked?'✓':''}</div>
      </div>`;
    } else if(gp.budget){
      const val=getBudget(ds);
      const cls=budgetClass(val);
      html+=`<div class="ml-row budget-row${secClass}">
        <div class="ml-dot" style="background:${gp.dotBg}"></div>
        <div class="ml-body"><div class="ml-label ${gp.catClass}">${gp.label}</div></div>
        <input type="number" class="ml-budget-input${cls?' '+cls:''}" placeholder="0" step="0.01"
          value="${val!==null?val:''}"
          onchange="setBudget('${ds}',this.value);this.className='ml-budget-input'+(this.value!==''?(parseFloat(this.value)>=0?' surplus':' deficit'):'')"
          oninput="this.className='ml-budget-input'+(this.value!==''?(parseFloat(this.value)>=0?' surplus':' deficit'):'')">
        <span class="ml-budget-symbol">€</span>
      </div>`;
    } else {
      const cellEntries=(entries[ds]&&entries[ds][gp.id]&&Array.isArray(entries[ds][gp.id]))?entries[ds][gp.id]:[];
      html+=`<div class="ml-row${secClass}" onclick="openModal('${ds}','${gp.id}',null)">
        <div class="ml-dot" style="background:${gp.dotBg}"></div>
        <div class="ml-body">
          <div class="ml-label ${gp.catClass}">${gp.label}</div>`;
      if(cellEntries.length){
        html+=`<div class="ml-entries">`;
        cellEntries.forEach((e,ei)=>{
          const cp=e.code?`<strong>${e.code}</strong> `:'';
          html+=`<span class="ml-pill ${gp.pillClass}" onclick="event.stopPropagation();openModal('${ds}','${gp.id}',${ei})">${cp}${escHtml(e.text)}</span>`;
        });
        html+=`</div>`;
      } else {
        html+=`<div class="ml-empty">tap to add</div>`;
      }
      html+=`</div><div class="ml-arrow">›</div></div>`;
    }
  });
  html+='</div>';
  document.getElementById('main-content').innerHTML=html;
}

// ── Desktop week view ─────────────────────────────────────────────────

function renderDesktopWeek(){
  const weekStart=ALL_WEEKS[currentWeekIdx];
  const days=Array.from({length:7},(_,i)=>addDays(weekStart,i));
  const today=todayStr();

  let html='<div class="desktop-week"><div class="week-grid">';
  html+='<div style="display:contents">';
  html+='<div class="cell" style="background:var(--paper);"></div>';
  days.forEach((d,i)=>{
    const ds=toDateStr(d), isToday=ds===today;
    html+=`<div class="cell" style="background:var(--paper);text-align:center;">
      <span class="day-label-main" style="${isToday?'color:var(--accent);font-weight:bold':''}">${DAY_NAMES[i]}</span>
      <span class="day-label-sub">${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</span>
    </div>`;
  });
  html+='</div>';

  GUIDEPOSTS.forEach(gp=>{
    const secClass=gp.secondary?' secondary-row':'';
    html+=`<div class="cell${secClass}" style="background:var(--paper);">
      <div class="guidepost-label ${gp.catClass}">${gp.label}</div>
      <span class="codes">${gp.codes.map(c=>c.code+(c.desc?': '+c.desc:'')).join('<br>')}</span>
    </div>`;
    days.forEach(d=>{
      const ds=toDateStr(d), isToday=ds===today;
      if(gp.checkbox){
        const checked=getCheckbox(ds,gp.id);
        html+=`<div class="cell cb-cell${secClass}${isToday?' today':''}">
          <div class="cb-cell-toggle${checked?' checked':''}" onclick="toggleCheckbox('${ds}','${gp.id}')">${checked?'✓':''}</div>
        </div>`;
      } else if(gp.budget){
        const val=getBudget(ds);
        const cls=budgetClass(val);
        html+=`<div class="cell budget-cell${secClass}${isToday?' today':''}">
          <input type="number" class="budget-cell-input${cls?' '+cls:''}" placeholder="0" step="0.01"
            value="${val!==null?val:''}"
            onchange="setBudget('${ds}',this.value);this.className='budget-cell-input'+(this.value!==''?(parseFloat(this.value)>=0?' surplus':' deficit'):'')"
            oninput="this.className='budget-cell-input'+(this.value!==''?(parseFloat(this.value)>=0?' surplus':' deficit'):'')">
        </div>`;
      } else {
        const cellEntries=(entries[ds]&&entries[ds][gp.id]&&Array.isArray(entries[ds][gp.id]))?entries[ds][gp.id]:[];
        html+=`<div class="cell entry-cell${secClass}${isToday?' today':''}" onclick="openModal('${ds}','${gp.id}',null)">`;
        cellEntries.forEach((e,ei)=>{
          const cp=e.code?`<strong>${e.code}</strong> `:'';
          html+=`<div class="entry-pill-sm ${gp.pillClass}" onclick="event.stopPropagation();openModal('${ds}','${gp.id}',${ei})">${cp}${escHtml(e.text)}</div>`;
        });
        if(!cellEntries.length) html+=`<span class="add-btn-hover">+</span>`;
        html+=`</div>`;
      }
    });
  });

  html+='</div></div>';
  document.getElementById('main-content').innerHTML=html;
}

// ── Month view ────────────────────────────────────────────────────────

function renderMonth(){
  const today=todayStr(), year=2026, month=currentMonthIdx;
  const firstDay=new Date(year,month,1), lastDay=new Date(year,month+1,0);
  const startDow=firstDay.getDay()||7;
  const gridStart=addDays(firstDay,-(startDow-1));
  const totalDays=Math.ceil((startDow-1+lastDay.getDate())/7)*7;

  let html='<div class="month-view">';
  GUIDEPOSTS.forEach(gp=>{
    const secClass=gp.secondary?' secondary':'';
    html+=`<div class="month-guidepost${secClass}">
      <div class="month-guidepost-header">
        <span class="corner-dot ${gp.dotClass}"></span>
        <span class="month-guidepost-title ${gp.catClass}">${gp.label}</span>
        <span class="month-guidepost-codes">${gp.codes.map(c=>c.code).filter(Boolean).join(' · ')}</span>
      </div>
      <div class="month-grid">`;
    DAY_NAMES.forEach(dn=>{
      html+=`<div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--ink-faint);text-align:center;padding:3px 0;letter-spacing:0.3px;">${dn}</div>`;
    });
    for(let i=0;i<totalDays;i++){
      const d=addDays(gridStart,i), ds=toDateStr(d);
      const isOther=d.getMonth()!==month, isToday=ds===today;
      if(gp.checkbox){
        const checked=getCheckbox(ds,gp.id);
        html+=`<div class="month-day-cell${isOther?' other-month':''}${isToday?' today':''}" onclick="toggleCheckbox('${ds}','${gp.id}')">
          <div class="month-day-num">${d.getDate()}</div>
          <span class="month-cb-dot${checked?' checked':''}"></span>
        </div>`;
      } else if(gp.budget){
        const val=getBudget(ds);
        const cls=budgetClass(val);
        html+=`<div class="month-day-cell${isOther?' other-month':''}${isToday?' today':''}">
          <div class="month-day-num">${d.getDate()}</div>
          <input type="number" class="month-budget-input${cls?' '+cls:''}" placeholder="—" step="0.01"
            value="${val!==null?val:''}"
            onchange="setBudget('${ds}',this.value);this.className='month-budget-input'+(this.value!==''?(parseFloat(this.value)>=0?' surplus':' deficit'):'')"
            oninput="this.className='month-budget-input'+(this.value!==''?(parseFloat(this.value)>=0?' surplus':' deficit'):'')"
            onclick="event.stopPropagation()">
        </div>`;
      } else {
        const cellEntries=(entries[ds]&&entries[ds][gp.id]&&Array.isArray(entries[ds][gp.id]))?entries[ds][gp.id]:[];
        html+=`<div class="month-day-cell${isOther?' other-month':''}${isToday?' today':''}" onclick="openModal('${ds}','${gp.id}',null)">
          <div class="month-day-num">${d.getDate()}</div>`;
        cellEntries.forEach((e,ei)=>{
          const cp=e.code?`<strong>${e.code}</strong> `:'';
          html+=`<div class="month-entry ${gp.pillClass}" onclick="event.stopPropagation();openModal('${ds}','${gp.id}',${ei})">${cp}${escHtml(e.text)}</div>`;
        });
        html+='</div>';
      }
    }
    html+='</div></div>';
  });
  html+='</div>';
  document.getElementById('main-content').innerHTML=html;
}

// ── Swipe support ─────────────────────────────────────────────────────

let txStart=0, tyStart=0;
document.addEventListener('touchstart',e=>{
  txStart=e.changedTouches[0].clientX;
  tyStart=e.changedTouches[0].clientY;
},{passive:true});
document.addEventListener('touchend',e=>{
  if(document.getElementById('modal-backdrop').classList.contains('open')) return;
  if(document.getElementById('picker-backdrop').classList.contains('open')) return;
  const dx=e.changedTouches[0].clientX-txStart;
  const dy=e.changedTouches[0].clientY-tyStart;
  if(Math.abs(dy)>Math.abs(dx)||Math.abs(dx)<44) return;
  if(isMobileLayout()){
    shiftMobileDay(dx<0?1:-1);
  } else {
    shiftPeriod(dx<0?1:-1);
  }
},{passive:true});

// ── Render ────────────────────────────────────────────────────────────

function isMobileLayout(){ return window.innerWidth<640; }

function renderContent(){
  if(isMobileLayout()){
    renderMobileList();
  } else if(currentView==='week'){
    renderDesktopWeek();
  } else {
    renderMonth();
  }
}

function renderAll(){
  renderPeriodNav();
  if(isMobileLayout()) renderMobileDateBar();
  renderContent();
}

let resizeTimer;
window.addEventListener('resize',()=>{
  clearTimeout(resizeTimer);
  resizeTimer=setTimeout(renderAll, 120);
});


// ── Modal ─────────────────────────────────────────────────────────────

let modalState={dateStr:null,gpId:null,entryIdx:null};

function openModal(dateStr,gpId,entryIdx){
  modalState={dateStr,gpId,entryIdx};
  const gp=GUIDEPOSTS.find(g=>g.id===gpId);
  const [y,m,d]=dateStr.split('-');
  const dateObj=new Date(+y,+m-1,+d);
  document.getElementById('modal-date').textContent=
    DAY_NAMES[(dateObj.getDay()||7)-1]+', '+d+' '+MONTH_NAMES[+m-1]+' '+y;
  document.getElementById('modal-guidepost').textContent=gp.label;
  document.getElementById('modal-guidepost').className='modal-title '+gp.catClass;

  const picker=document.getElementById('code-picker');
  picker.innerHTML='';
  gp.codes.forEach(c=>{
    if(!c.code) return;
    const btn=document.createElement('button');
    btn.className=`code-chip ${gp.chipClass}`;
    btn.dataset.code=c.code;
    btn.textContent=c.code+(c.desc?' — '+c.desc:'');
    btn.onclick=()=>toggleCode(btn);
    picker.appendChild(btn);
  });

  const existing=(entries[dateStr]&&entries[dateStr][gpId]&&entryIdx!==null&&Array.isArray(entries[dateStr][gpId]))
    ?entries[dateStr][gpId][entryIdx]:null;
  document.getElementById('modal-text').value=existing?existing.text:'';
  if(existing&&existing.code){
    picker.querySelectorAll('.code-chip').forEach(b=>{ if(b.dataset.code===existing.code) b.classList.add('selected'); });
  }
  const delBtn=document.getElementById('btn-delete');
  existing?delBtn.classList.remove('hidden'):delBtn.classList.add('hidden');
  document.getElementById('modal-backdrop').classList.add('open');
  setTimeout(()=>document.getElementById('modal-text').focus(),150);
}

function toggleCode(btn){
  const was=btn.classList.contains('selected');
  document.querySelectorAll('.code-chip').forEach(b=>b.classList.remove('selected'));
  if(!was) btn.classList.add('selected');
}

function closeModal(){
  document.getElementById('modal-backdrop').classList.remove('open');
}

function handleBackdropClick(e){
  if(e.target===document.getElementById('modal-backdrop')) closeModal();
}

function saveEntry(){
  const{dateStr,gpId,entryIdx}=modalState;
  const text=document.getElementById('modal-text').value.trim();
  if(!text){closeModal();return;}
  const chip=document.querySelector('.code-chip.selected');
  const code=chip?chip.dataset.code:null;
  if(!entries[dateStr]) entries[dateStr]={};
  if(!entries[dateStr][gpId]) entries[dateStr][gpId]=[];
  if(entryIdx!==null) entries[dateStr][gpId][entryIdx]={code,text};
  else entries[dateStr][gpId].push({code,text});
  saveData(entries); closeModal(); renderContent();
}

function deleteEntry(){
  const{dateStr,gpId,entryIdx}=modalState;
  if(entryIdx!==null&&entries[dateStr]&&entries[dateStr][gpId]){
    entries[dateStr][gpId].splice(entryIdx,1);
    if(!entries[dateStr][gpId].length) delete entries[dateStr][gpId];
    if(!Object.keys(entries[dateStr]).length) delete entries[dateStr];
    saveData(entries);
  }
  closeModal(); renderContent();
}

document.addEventListener('keydown',e=>{
  if(!document.getElementById('modal-backdrop').classList.contains('open')) return;
  if(e.key==='Escape') closeModal();
  if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)) saveEntry();
});

// ── Import / Export ───────────────────────────────────────────────────

function exportData(){
  const blob=new Blob([JSON.stringify(entries,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='guidepost-tracker-2026.json';
  a.click(); URL.revokeObjectURL(url);
}

function triggerImport(){
  document.getElementById('import-file-input').value='';
  document.getElementById('import-file-input').click();
}

function importData(event){
  const file=event.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=e=>{
    try{
      const parsed=JSON.parse(e.target.result);
      if(typeof parsed!=='object'||Array.isArray(parsed)) throw new Error();
      entries=Object.assign({},entries,parsed);
      saveData(entries); renderAll(); showToast('Data imported ✓');
    }catch{ showToast('Import failed — invalid file'); }
  };
  reader.readAsText(file);
}

function showToast(msg){
  let t=document.getElementById('toast');
  if(!t){
    t=document.createElement('div'); t.id='toast';
    Object.assign(t.style,{
      position:'fixed',bottom:'calc(24px + var(--safe-bottom))',left:'50%',
      transform:'translateX(-50%)',background:'var(--ink)',color:'var(--cream)',
      fontFamily:"'DM Mono',monospace",fontSize:'12px',padding:'10px 18px',
      borderRadius:'8px',boxShadow:'0 4px 20px rgba(0,0,0,.25)',
      zIndex:'999',pointerEvents:'none',transition:'opacity 0.3s',
    });
    document.body.appendChild(t);
  }
  t.textContent=msg; t.style.opacity='1';
  clearTimeout(t._timer);
  t._timer=setTimeout(()=>{ t.style.opacity='0'; },2200);
}

// ── Utils ─────────────────────────────────────────────────────────────

function escHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Init ──────────────────────────────────────────────────────────────
(async () => {
  await loadFromGitHub();
  renderAll();
})();

// Re-sync when tab becomes visible (switching back from another device)
document.addEventListener('visibilitychange', async () => {
  if(document.visibilityState === 'visible' && !syncPending){
    await loadFromGitHub();
    renderAll();
  }
});
</script>
